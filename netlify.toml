[build]
  command = "npm run build"
  publish = "dist"
  # Builds only ship on demand: a deploy-branch commit with "[deploy]" in its message.
  ignore = "sh ./scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

# Public Terms of Service and Privacy Policy, written by the build (vite.config.ts).
[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every page. The game loads its own scripts, Google Fonts and the
# Supabase project (REST and realtime websockets); anything else is refused.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-0L/xp690it2Vk2cQD+7jHN/e0AKornes4Z6vDuxWJIE='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob: https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# The service worker and manifest must update as soon as a new build ships.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Sends due push alerts every minute (production deploys only).
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["web-push"]
[functions."push-send"]
  schedule = "* * * * *"
