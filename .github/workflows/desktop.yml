# Builds the Windows desktop app (desktop/). The app only opens cartopia.lol, so it
# needs rebuilding only when desktop/ changes, never for a game deploy.
# Runs on PRs that touch it (as a check, with screenshots of the app running live),
# and by hand from the Actions tab: tick "release" to publish it as the download.
name: Desktop app

on:
  pull_request:
    paths: [desktop/**, .github/workflows/desktop.yml]
  workflow_dispatch:
    inputs:
      release:
        description: Publish as the latest download
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npx tauri build
      - name: Name the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1) out/Cartopia-Setup.exe
          Copy-Item src-tauri/target/release/cartopia-desktop.exe out/Cartopia.exe
          Get-ChildItem out | Format-Table Name, Length
      - name: Run it and take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD/shots/$name.png")
          }
          New-Item -ItemType Directory shots | Out-Null
          # Offline: nothing answers at this address.
          $env:CARTOPIA_URL = 'http://127.0.0.1:9'
          $p = Start-Process out/Cartopia.exe -PassThru
          Start-Sleep 15
          Shot '1-offline'
          Stop-Process $p
          Remove-Item Env:CARTOPIA_URL
          # The live game.
          $p = Start-Process out/Cartopia.exe -PassThru
          Start-Sleep 20
          Shot '2-loading'
          Start-Sleep 70
          Shot '3-live-game'
          [System.Windows.Forms.SendKeys]::SendWait('{F11}')
          Start-Sleep 5
          Shot '4-fullscreen'
          if ($p.HasExited) { throw 'The app closed by itself' }
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: cartopia-desktop
          path: |
            desktop/out
            desktop/shots
      - name: Publish the download
        if: inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "desktop-v$v"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag out/Cartopia-Setup.exe out/Cartopia.exe --clobber
          } else {
            gh release create $tag out/Cartopia-Setup.exe out/Cartopia.exe --target $env:GITHUB_SHA --title "Cartopia for Windows $v" --notes "Install Cartopia-Setup.exe. The game updates itself; this file only changes when the app does." --latest
          }
