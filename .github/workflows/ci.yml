# Runs on every PR and on the deploy branch, so a failing test or broken build
# shows up as a red check before it merges (Netlify only checks that it builds).
name: CI

on:
  pull_request:
  push:
    branches: [claude/kickoff-setup-pqyfzp]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint, typecheck and build
        run: npm run build
      - name: Tests
        run: npx vitest run
      - name: Startup smoke test (built game opens in Chromium)
        run: |
          npx playwright install --with-deps chromium-headless-shell
          npm run smoke
