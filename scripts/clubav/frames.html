<!doctype html>
<html><head><meta charset="UTF-8" /><title>Club lights</title>
<style>html, body, #root { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
#label { position: fixed; top: 8px; left: 12px; font: 700 22px sans-serif; color: #fff; text-shadow: 0 1px 3px #000; }
</style>
<script>
  // A clock the capture script drives, so every frame lands at an exact moment.
  window.__fake = null
  const real = performance.now.bind(performance)
  performance.now = () => (window.__fake ?? real())
</script></head>
<body><div id="root"></div><div id="label"></div><script type="module" src="./frames.tsx"></script></body></html>
